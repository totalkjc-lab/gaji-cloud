<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가지 클라우드 — 내 맵</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FBFBFD;
    --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#86868B;
    --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.14);
    --accent:#0071E3; --green:#34C759; --red:#FF3B30; --violet:#5E5CE6;
    --glass:rgba(250,250,252,.72);
    --sh-1:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
    --sh-2:0 2px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.09);
    --ease:cubic-bezier(.25,.1,.25,1);
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
      --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#8E8E93;
      --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.2);
      --accent:#0A84FF; --green:#30D158; --red:#FF453A; --violet:#7D7AFF;
      --glass:rgba(28,28,30,.72);
      --sh-1:0 1px 2px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.4);
      --sh-2:0 2px 6px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.5);
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ---------- 상단 바 ---------- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:12px clamp(16px,4vw,40px);background:var(--glass);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line)}
  .mark{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .mark svg{width:22px;height:22px;flex:none;color:var(--ink)}
  .mark b{font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  #who{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  #readonly-badge{display:none;align-items:center;gap:5px;font-size:12px;font-weight:600;
    color:#fff;background:var(--violet);padding:5px 11px;border-radius:999px;white-space:nowrap}
  #readonly-badge svg{width:13px;height:13px}

  /* ---------- 버튼 ---------- */
  .btn{appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;
    font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:-.01em;
    padding:9px 18px;cursor:pointer;transition:transform .18s var(--ease),opacity .18s var(--ease);
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{opacity:.88}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
  .btn.quiet:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);opacity:1}

  /* ---------- 본문 ---------- */
  main{max-width:1120px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 80px}
  .headline{margin:0 0 6px;font-size:clamp(30px,5.2vw,44px);font-weight:700;letter-spacing:-.03em;
    line-height:1.08;text-wrap:balance}
  .subline{margin:0 0 clamp(24px,4vw,36px);font-size:clamp(15px,2vw,17px);color:var(--ink-2);letter-spacing:-.01em}

  /* ---------- 맵 타일 ---------- */
  #list{display:grid;gap:clamp(12px,2vw,18px);
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .tile{position:relative;display:flex;flex-direction:column;gap:2px;
    padding:18px 16px 16px;border-radius:18px;background:var(--surface);
    box-shadow:var(--sh-1);text-decoration:none;color:var(--ink);
    transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
  .tile:active{transform:translateY(-1px) scale(.99)}
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tile .art{width:100%;aspect-ratio:1;display:grid;place-items:center;margin-bottom:12px;
    border-radius:14px;background:var(--surface-2);color:var(--ink);overflow:hidden}
  .tile .art svg{width:78%;height:78%;display:block}
  .tile .nm{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .meta{font-size:12px;color:var(--ink-3);letter-spacing:-.005em;
    font-variant-numeric:tabular-nums;margin-top:3px}

  .tile.add{align-items:center;justify-content:center;text-align:center;gap:10px;
    background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);cursor:pointer;
    font-family:var(--font);min-height:0}
  .tile.add:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);
    box-shadow:inset 0 0 0 1.5px var(--accent);transform:translateY(-3px)}
  .tile.add .plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:var(--accent);color:#fff}
  .tile.add .plus svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
  .tile.add span{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.01em}

  /* ---------- 공유 카드 ---------- */
  #owner-controls{display:none;margin-top:clamp(28px,4vw,44px)}
  .card{background:var(--surface);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
  .card h2{margin:0;padding:16px 20px 12px;font-size:13px;font-weight:600;
    letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
  .row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
  .row .txt{flex:1;min-width:0}
  .row .txt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .row .txt small{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
  #share-row{display:none}
  #share-link{flex:1;min-width:0;font:12px/1.4 var(--mono);color:var(--ink-2);
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}

  /* iOS 스타일 스위치 */
  .switch{position:relative;width:51px;height:31px;flex:none}
  .switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:rgba(120,120,128,.2);
    transition:background .25s var(--ease);pointer-events:none}
  .switch .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
    background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
    transition:transform .25s var(--ease);pointer-events:none}
  .switch input:checked ~ .track{background:var(--green)}
  .switch input:checked ~ .knob{transform:translateX(20px)}
  .switch input:focus-visible ~ .track{outline:2px solid var(--accent);outline-offset:3px}

  /* ---------- 빈 상태 · 알림 ---------- */
  .empty{grid-column:1/-1;padding:clamp(40px,8vw,72px) 24px;text-align:center}
  .empty svg{width:44px;height:44px;color:var(--ink-3);fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
  .empty b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px}
  .empty p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.5}

  @media (max-width:520px){
    #list{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
    #who{display:none}
    .row{flex-wrap:wrap;gap:12px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .tile:hover,.tile.add:hover{transform:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 21V9"/><path d="M12 13.5 7 9.5"/><path d="M12 11 17 7"/>
      <circle cx="12" cy="7" r="2.4"/><circle cx="6" cy="8.4" r="1.9"/><circle cx="18" cy="5.8" r="1.9"/>
    </svg>
    <b>가지 클라우드</b>
  </div>
  <span id="readonly-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
    </svg>
    읽기 전용
  </span>
  <span id="who"></span>
  <button class="btn quiet" id="logout">로그아웃</button>
</div>

<main>
  <h1 class="headline" id="title">내 맵</h1>
  <p class="subline" id="count"></p>

  <div id="list"></div>

  <section id="owner-controls">
    <div class="card">
      <h2>공유</h2>
      <div class="row">
        <div class="txt">
          <b>이 폴더 공개</b>
          <small id="public-hint">공개하면 링크를 받은 사람이 맵을 볼 수 있습니다. 수정은 나만 할 수 있습니다.</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="public-toggle">
          <span class="track"></span><span class="knob"></span>
        </label>
      </div>
      <div class="row" id="share-row">
        <input id="share-link" readonly aria-label="공유 링크">
        <button class="btn quiet" id="copy-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M6 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V6"/></svg>
          링크 복사
        </button>
      </div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
