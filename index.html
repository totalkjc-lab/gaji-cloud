<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가지 클라우드 — 로그인</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#86868B;
    --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.14); --accent:#0071E3; --red:#FF3B30;
    --sh:0 2px 6px rgba(0,0,0,.06), 0 16px 44px rgba(0,0,0,.10);
    --ease:cubic-bezier(.25,.1,.25,1);
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#8E8E93;
      --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.2); --accent:#0A84FF; --red:#FF453A;
      --sh:0 2px 6px rgba(0,0,0,.5), 0 16px 44px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}

  .card{width:100%;max-width:400px;text-align:center;padding:clamp(32px,7vw,44px) clamp(24px,6vw,38px) 32px;
    border-radius:22px;background:var(--surface);box-shadow:var(--sh)}

  /* 가지가 뻗어나가는 모양 — 이 도구가 무엇을 하는지 한눈에 보여주는 표식 */
  .mark{width:56px;height:56px;margin:0 auto 20px;color:var(--ink)}
  .mark svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .mark .b1{stroke:#2E6FD9}.mark .b2{stroke:#E2841F}.mark .b3{stroke:#2FA37A}

  h1{margin:0 0 8px;font-size:clamp(23px,4.5vw,27px);font-weight:700;letter-spacing:-.028em;line-height:1.2}
  .sub{margin:0 0 28px;font-size:15px;color:var(--ink-2);letter-spacing:-.01em;line-height:1.5}

  button{appearance:none;width:100%;border:0;border-radius:999px;background:var(--accent);color:#fff;
    font-family:var(--font);font-size:15px;font-weight:600;letter-spacing:-.01em;padding:14px 22px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    transition:opacity .18s var(--ease),transform .18s var(--ease)}
  button:hover:not(:disabled){opacity:.88}
  button:active:not(:disabled){transform:scale(.98)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  button:disabled{opacity:.5;cursor:default}
  button svg{width:17px;height:17px;flex:none}

  #error{margin:14px 0 0;min-height:1.3em;font-size:13px;color:var(--red);line-height:1.45}
  .foot{margin:24px 0 0;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink-3);line-height:1.5}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 44V26"/>
        <path class="b1" d="M24 30 13 22"/>
        <path class="b2" d="M24 26l11-9"/>
        <path class="b3" d="M24 22 15 12"/>
        <circle cx="24" cy="23" r="3.4"/>
        <circle class="b1" cx="11.2" cy="20.6" r="2.6"/>
        <circle class="b2" cx="36.6" cy="15.6" r="2.6"/>
        <circle class="b3" cx="13.4" cy="10.4" r="2.6"/>
      </svg>
    </div>
    <h1>가지 클라우드</h1>
    <p class="sub">생각을 가지처럼 펼치고,<br>어느 기기에서든 이어서 씁니다.</p>
    <button id="google">
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91a8.78 8.78 0 0 0 2.69-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86a5.36 5.36 0 0 1-5.03-3.71H1.05v2.34A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.96H1.05a9 9 0 0 0 0 8.09l2.92-2.34Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59A8.98 8.98 0 0 0 1.05 4.96l2.92 2.33A5.36 5.36 0 0 1 9 3.58Z"/>
      </svg>
      구글로 로그인
    </button>
    <p id="error" role="alert"></p>
    <p class="foot">고칠 때마다 자동으로 저장됩니다. 폴더를 공개하면 링크를 받은 사람이 맵을 볼 수 있습니다.</p>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      try {
        const user = await Auth.getUser();
        if (user) { location.href = "dashboard.html"; return; }
      } catch (err) {
        console.error("Failed to check user session:", err);
      }
      document.getElementById("google").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        document.getElementById("error").textContent = "";
        try {
          await Auth.signInWithGoogle();
        } catch (err) {
          console.error("Google sign-in failed:", err);
          btn.disabled = false;
          document.getElementById("error").textContent = "로그인에 실패했습니다. 다시 시도해 주세요.";
        }
      });
    })();
  </script>
</body>
</html>
